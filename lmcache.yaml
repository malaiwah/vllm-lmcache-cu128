chunk_size: 256                # tokens per chunk for prefix cache
local_cpu: true                # enable CPU RAM tier
max_local_cpu_size: 32.0
local_disk: "/root/.cache/lmcache"    # <-- MUST be a string; "file:///..." also ok
max_local_disk_size: 0
save_decode_cache: false
save_unfull_chunk: true
cache_policy: "LRU"
